name: CI

on:
  pull_request:
    types: [opened, synchronize, closed]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend vet, build, and test
    if: github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOWORK: 'off'

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.event.pull_request.base.repo.full_name }}
          ref: ${{ github.event.action == 'closed' && github.event.pull_request.base.ref || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum

      - name: Create frontend embed placeholder
        run: |
          mkdir -p web/dist
          touch web/dist/index.html

      - name: Vet root module
        run: go vet ./...

      - name: Vet relaykit independently
        working-directory: relaykit
        run: go vet ./...

      - name: Build root module
        run: go build ./...

      - name: Build relaykit independently
        working-directory: relaykit
        run: go build ./...

      - name: Test root and relaykit modules
        run: make test

  database-contracts:
    name: Development database and Redis contracts
    if: github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: new-api-test
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: new_api_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pnew-api-test"
          --health-interval=2s --health-timeout=3s --health-retries=60
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: new_api_test
          POSTGRES_PASSWORD: new-api-test
          POSTGRES_DB: new_api_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U new_api_test -d new_api_test"
          --health-interval=2s --health-timeout=3s --health-retries=60
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=2s --health-timeout=3s --health-retries=30
      clickhouse:
        image: clickhouse/clickhouse-server:25.8
        env:
          CLICKHOUSE_DB: new_api_test_log
          CLICKHOUSE_USER: new_api_test
          CLICKHOUSE_PASSWORD: new-api-test
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: '1'
        ports:
          - 9000:9000
        options: >-
          --health-cmd="clickhouse-client --user new_api_test --password new-api-test --query 'SELECT 1'"
          --health-interval=2s --health-timeout=3s --health-retries=60
    env:
      TEST_MYSQL_DSN: 'root:new-api-test@tcp(127.0.0.1:3306)/new_api_test?charset=utf8mb4&parseTime=True&loc=UTC'
      TEST_MYSQL_LOG_DSN: 'root:new-api-test@tcp(127.0.0.1:3306)/new_api_test_log?charset=utf8mb4&parseTime=True&loc=UTC'
      TEST_POSTGRES_DSN: 'postgres://new_api_test:new-api-test@127.0.0.1:5432/new_api_test?sslmode=disable'
      TEST_POSTGRES_LOG_DSN: 'postgres://new_api_test:new-api-test@127.0.0.1:5432/new_api_test_log?sslmode=disable'
      TEST_WS_MANAGER_REDIS_ADDR: '127.0.0.1:6379'
      TEST_CLICKHOUSE_LOG_DSN: 'clickhouse://new_api_test:new-api-test@127.0.0.1:9000/new_api_test_log'
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.event.pull_request.base.repo.full_name }}
          ref: ${{ github.event.action == 'closed' && github.event.pull_request.base.ref || github.ref }}
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum
      - name: Create isolated log databases
        run: |
          docker exec ${{ job.services.mysql.id }} mysql -uroot -pnew-api-test -e 'CREATE DATABASE new_api_test_log;'
          docker exec ${{ job.services.postgres.id }} psql -U new_api_test -d new_api_test -c 'CREATE DATABASE new_api_test_log;'
      - name: Test matrix failure gates
        run: python3 -m unittest discover -s bin -p test_database_matrix_test.py
      - name: Verify every database contract runs
        run: python3 bin/test_database_matrix.py

  frontend:
    name: Frontend typecheck and test
    if: github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.event.pull_request.base.repo.full_name }}
          ref: ${{ github.event.action == 'closed' && github.event.pull_request.base.ref || github.ref }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test
